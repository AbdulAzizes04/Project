# Model Architecture Configurations for EARTH VISION-X

siamese_vit:
  name: "Siamese Vision Transformer (ViT-Base-CD)"
  backbone: "vit_b_16"
  patch_size: 16
  embed_dim: 768
  num_heads: 12
  depth: 12
  dropout: 0.1
  fusion: "difference_concatenation" # [F1, F2, |F1 - F2|]
  fusion_channels: 256
  decoder_channels: [128, 64, 32, 16]

unet_baseline:
  name: "Bitemporal U-Net Baseline"
  in_channels: 6 # Concatenated T1 and T2 RGB
  encoder_channels: [64, 128, 256, 512]
  bottleneck: 1024
  decoder_channels: [512, 256, 128, 64]

siamese_cnn:
  name: "Siamese ResNet-18 CNN Baseline"
  backbone: "resnet18"
  feature_dim: 512
  fusion: "absolute_difference"
  decoder_channels: [256, 128, 64, 32]
