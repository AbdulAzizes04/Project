{% extends "base.html" %}

{% block title %}Server Error - SleepAI{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <h1 class="display-1 fw-bold text-danger">500</h1>
        <h3 class="fw-bold text-dark mb-3">Internal System Error</h3>
        <p class="text-muted mb-4 max-w-500 mx-auto">An unexpected error occurred during processing. The system has safely logged the event.</p>
        <a href="{{ url_for('user.dashboard') }}" class="btn btn-primary-custom px-4">
            <i class="fas fa-columns me-2"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
